apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-deployment
  namespace: helm
  labels:
    app: mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb-container
          image: "{{ .Values.mongodb.image.repository }}:{{ .Values.mongodb.image.tag }}"
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongodb-storage
              mountPath: /data/db
          
      volumes:
        - name: mongodb-storage
          persistentVolumeClaim:
            claimName: shared-pvc
            
        