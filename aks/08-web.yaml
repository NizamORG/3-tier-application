apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: robot-shop
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: <ACR_LOGIN_SERVER>/robotshop/rs-web:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: CATALOGUE_HOST
              valueFrom:
                configMapKeyRef:
                  name: robotshop-config
                  key: CATALOGUE_HOST
            - name: USER_HOST
              valueFrom:
                configMapKeyRef:
                  name: robotshop-config
                  key: USER_HOST
            - name: CART_HOST
              valueFrom:
                configMapKeyRef:
                  name: robotshop-config
                  key: CART_HOST
            - name: SHIPPING_HOST
              valueFrom:
                configMapKeyRef:
                  name: robotshop-config
                  key: SHIPPING_HOST
            - name: PAYMENT_HOST
              valueFrom:
                configMapKeyRef:
                  name: robotshop-config
                  key: PAYMENT_HOST
            - name: RATINGS_HOST
              valueFrom:
                configMapKeyRef:
                  name: robotshop-config
                  key: RATINGS_HOST
          readinessProbe:
            httpGet:
              path: /api/catalogue/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /nginx_status
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: robot-shop
spec:
  selector:
    app: web
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
