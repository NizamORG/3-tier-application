---
# Ratings
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ratings
  namespace: robot-shop
  labels:
    app: ratings
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ratings
  template:
    metadata:
      labels:
        app: ratings
    spec:
      containers:
        - name: ratings
          image: <ACR_LOGIN_SERVER>/robotshop/rs-ratings:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: CATALOGUE_URL
              valueFrom:
                configMapKeyRef:
                  name: robotshop-config
                  key: CATALOGUE_URL
          readinessProbe:
            httpGet:
              path: /_health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /_health
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: ratings
  namespace: robot-shop
spec:
  selector:
    app: ratings
  ports:
    - port: 80
      targetPort: 80

---
# Dispatch (worker)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatch
  namespace: robot-shop
  labels:
    app: dispatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dispatch
  template:
    metadata:
      labels:
        app: dispatch
    spec:
      containers:
        - name: dispatch
          image: <ACR_LOGIN_SERVER>/robotshop/rs-dispatch:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: AMQP_HOST
              valueFrom:
                configMapKeyRef:
                  name: robotshop-config
                  key: AMQP_HOST
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - kill -0 1
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 50Mi
            limits:
              cpu: 200m
              memory: 100Mi
