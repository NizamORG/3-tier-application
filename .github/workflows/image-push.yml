name: Docker build & push

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/image-push.yml'
      - 'cart/**'
      - 'dispatch/**'
      - 'mongo/**'
      - 'mysql/**'
      - 'payment/**'
      - 'rating/**'
      - 'user/**'
      - 'web/**'
jobs:
   Identify-change:
    runs-on: ubuntu-latest
    steps:
     - name: Checkout code
       uses: actions/checkout@v6

     - name: Identify changed directories
       id: identify-changes
       run: |
         echo "Changed directories:"
         git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep '/' | cut -d'/' -f1 | sort -u > changed_dirs.txt
         cat changed_dirs.txt

     - name: Set output for changed directories
       id: set-output
       run: |
         changed_dirs=$(cat changed_dirs.txt)
         echo "changed_dirs=$changed_dirs" >> $GITHUB_ENV